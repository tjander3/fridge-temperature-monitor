services:
  dashboard:
    image: fridge-temperature-monitor-dashboard
    build:
      context: ./dashboard
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - monitor-data:/data
      - ${SENSORS_FILE:-./dashboard/sensors.example.json}:/app/sensors.json:ro
    environment:
      ADMIN_API_TOKEN: "${ADMIN_API_TOKEN:-}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  notifier:
    image: fridge-temperature-monitor-dashboard
    command:
      - python
      - notifier.py
    environment:
      NOTIFIER_POLL_SECONDS: "${NOTIFIER_POLL_SECONDS:-30}"
      NOTIFY_DASHBOARD_URL: "${NOTIFY_DASHBOARD_URL:-}"
      NOTIFY_EMAIL_ENABLED: "${NOTIFY_EMAIL_ENABLED:-false}"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURITY: "${SMTP_SECURITY:-starttls}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_APP_PASSWORD: "${SMTP_APP_PASSWORD:-}"
      NOTIFY_EMAIL_FROM: "${NOTIFY_EMAIL_FROM:-}"
      NOTIFY_EMAIL_TO: "${NOTIFY_EMAIL_TO:-}"
    volumes:
      - monitor-data:/data
      - ${SENSORS_FILE:-./dashboard/sensors.example.json}:/app/sensors.json:ro
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - notifier.py
        - --healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  rtl433:
    image: hertzg/rtl_433:25.12
    devices:
      - /dev/bus/usb:/dev/bus/usb
    command:
      - -d
      - ":00000001"
      - -f
      - 433.92M
      - -R
      - "41"
      - -F
      - json
      - -F
      - syslog:dashboard:1514
      - -M
      - time:iso:tz
      - -M
      - level
      - -M
      - protocol
      - -C
      - customary
    depends_on:
      dashboard:
        condition: service_healthy
        # Refresh rtl_433's UDP destination whenever Compose replaces the
        # dashboard container. Otherwise it can keep sending to the old IP.
        restart: true
    restart: unless-stopped

volumes:
  monitor-data:
    name: fridge-temperature-monitor-data
