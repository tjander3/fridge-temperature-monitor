services:
  dashboard:
    build:
      context: ./dashboard
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - monitor-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  rtl433:
    image: hertzg/rtl_433:25.12
    devices:
      - /dev/bus/usb:/dev/bus/usb
    command:
      - -d
      - ":00000001"
      - -f
      - 433.92M
      - -R
      - "41"
      - -F
      - json
      - -F
      - syslog:dashboard:1514
      - -M
      - time:iso:tz
      - -M
      - level
      - -M
      - protocol
      - -C
      - customary
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped

volumes:
  monitor-data:
    name: fridge-temperature-monitor-data
