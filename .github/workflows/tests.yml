name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run commit-time suite
        shell: pwsh
        run: ./scripts/test-ci.ps1
      - name: Build and smoke-test application containers
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker compose logs --no-color dashboard notifier || true
            docker compose down --volumes || true
          }
          trap cleanup EXIT
          docker compose up --detach --build dashboard notifier
          for attempt in {1..15}; do
            dashboard_ok=false
            notifier_ok=false
            if curl --fail --silent http://127.0.0.1:8080/api/health | grep --quiet '"status":"ok"'; then
              dashboard_ok=true
            fi
            notifier_id="$(docker compose ps --quiet notifier)"
            if [[ -n "$notifier_id" ]] && [[ "$(docker inspect --format '{{.State.Health.Status}}' "$notifier_id")" == "healthy" ]]; then
              notifier_ok=true
            fi
            if [[ "$dashboard_ok" == true && "$notifier_ok" == true ]]; then
              exit 0
            fi
            sleep 2
          done
          echo "Application containers did not become healthy in time" >&2
          exit 1
